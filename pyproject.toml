[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingbot"
version = "0.1.0"
description = "Semi-automatic trading alert, research, and backtesting toolkit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "requests>=2.31",
  "duckdb>=1.0",
]

[project.optional-dependencies]
dev = []
research = []

[project.scripts]
tradingbot-monitor = "hkbot.monitor:main"
tradingbot-scheduler = "hkbot.scheduler:main"
tradingbot-command = "hkbot.command:main"
tradingbot-warehouse = "hkbot.warehouse:main"

[tool.setuptools.packages.find]
include = ["hkbot*"]
